# Smart Agriculture – i18n message bundle  (English – default)
# ═══════════════════════════════════════════════════════════════════════════

# ── Harvest advisories ────────────────────────────────────────────────────
advisory.harvest.approaching=Your {0} crop is due for harvest in {1} day(s). Prepare harvesting equipment.
advisory.harvest.overdue=The expected harvest date for {0} has passed. Delayed harvest can lead to quality loss.
advisory.harvest.ready=Crop {0} is marked ready but not yet harvested - quality may deteriorate.

# ── Irrigation advisories ─────────────────────────────────────────────────
advisory.irrigation.due=Weekly irrigation check: ensure adequate water supply for {0} (Day {1}).
advisory.irrigation.soil.moisture=Soil moisture check due for {0}.

# ── Fertilisation advisories ──────────────────────────────────────────────
advisory.fertilisation.first={0} is 15 days old. Apply the first dose of NPK fertiliser.
advisory.fertilisation.topdress={0} has reached 30-day growth milestone - consider top dressing fertiliser.

# ── Crop health advisories ────────────────────────────────────────────────
advisory.crop.failed=Crop {0} has been marked as FAILED. Review soil reports and consult an agronomist.
advisory.pest.season=Peak pest season for KHARIF crops - inspect {0} for signs of infestation.

# ── Weather advisories ────────────────────────────────────────────────────
advisory.weather.rain=Rain expected - skip irrigation today for {0}.
advisory.weather.frost=Frost alert - protect {0} with covering tonight.
advisory.weather.heat=Extreme heat alert - increase irrigation frequency for {0}.
