spring:
  application:
    name: smart-agriculture
  profiles:
    active: dev
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:8a3c9b745e1f0c2d6e4b8a9c3f1e0d2b7a6c5f4e3d2b1a0c9f8e7d6c5b4a3f2e}
  expiration: 86400000

weather:
  api-key: ${WEATHER_API_KEY:demo_key}
  default-city: Pune

market:
  api-key: ${MARKET_API_KEY:579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}

aws:
  enabled: ${AWS_ENABLED:false}
  bucket: ${AWS_BUCKET:smart-agri-photos}
  region: ${AWS_REGION:ap-south-1}
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}

